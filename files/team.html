<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Team - Premium Uni League</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* =============================== */
        /* MY TEAM PAGE                    */
        /* =============================== */
        .myteam-section {
            padding: 60px 20px 100px;
        }

        .myteam-inner {
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Page header */
        .page-heading {
            text-align: center;
            margin-bottom: 50px;
        }

        .page-heading h2 {
            font-size: clamp(2rem, 5vw, 3rem);
            margin-bottom: 10px;
        }

        .page-heading p {
            font-size: 1rem;
            color: var(--text-muted);
            margin: 0;
        }

        /* =============================== */
        /* TEAM IDENTITY BLOCK             */
        /* =============================== */
        .team-identity {
            background: linear-gradient(135deg, rgba(200, 170, 110, 0.1), rgba(200, 170, 110, 0.03));
            border: 1px solid var(--glass-border);
            border-radius: 20px 20px 0 0;
            padding: 30px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            border-bottom: 2px solid var(--gold-main);
        }

        .team-identity-left {
            display: flex;
            align-items: center;
            gap: 18px;
        }

        .team-logo-placeholder {
            width: 56px;
            height: 56px;
            border-radius: 12px;
            background: rgba(200, 170, 110, 0.15);
            border: 2px solid var(--gold-main);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            box-shadow: 0 0 20px rgba(200, 170, 110, 0.2);
        }

        .team-identity-name {
            font-family: var(--font-heading);
            font-size: clamp(1.8rem, 4vw, 2.6rem);
            font-weight: 800;
            color: var(--gold-main);
            text-transform: uppercase;
            letter-spacing: 3px;
            text-shadow: 0 0 20px rgba(200, 170, 110, 0.4);
        }

        .team-identity-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin-top: 2px;
        }

        .team-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-disband {
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.5);
            color: #ff4d4d;
            padding: 10px 20px;
            border-radius: 6px;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.85rem;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-disband:hover {
            background: rgba(255, 77, 77, 0.2);
            box-shadow: 0 0 20px rgba(255, 77, 77, 0.3);
        }

        /* =============================== */
        /* PLAYER ROSTER TABLE             */
        /* =============================== */
        .roster-table-wrap {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-top: none;
            border-radius: 0 0 20px 20px;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0, 0, 0, 0.5);
        }

        .roster-row {
            display: grid;
            grid-template-columns: 50px 1fr 1fr 160px 140px;
            align-items: center;
            padding: 0 30px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
            gap: 10px;
        }

        @media (max-width: 720px) {
            .roster-row { grid-template-columns: 40px 1fr 140px; }
            .roster-row .col-id { display: none; }
            .roster-row .col-actions { grid-column: 3; }
        }
        @media (max-width: 500px) {
            .roster-row { grid-template-columns: 1fr auto; padding: 0 16px; }
            .roster-row .col-num, .roster-row .col-id { display: none; }
            .roster-row .col-role { display: none; }
        }

        .roster-row.header-row {
            background: rgba(200, 170, 110, 0.07);
            border-bottom: 1px solid var(--glass-border);
            padding-top: 0;
            padding-bottom: 0;
        }

        .roster-row.header-row span {
            font-family: var(--font-heading);
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--text-muted);
            padding: 14px 0;
        }

        .roster-row.player-row {
            padding-top: 0;
            padding-bottom: 0;
            min-height: 72px;
        }

        .roster-row.player-row:last-child {
            border-bottom: none;
        }

        .roster-row.player-row:hover {
            background: rgba(255, 255, 255, 0.03);
        }

        .roster-row.captain-row {
            background: rgba(10, 200, 245, 0.04);
        }

        .roster-row.captain-row:hover {
            background: rgba(10, 200, 245, 0.07);
        }

        .col-num {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .player-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .player-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        .player-fullname {
            font-family: var(--font-heading);
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-light);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .captain-tag {
            font-size: 0.65rem;
            background: rgba(10, 200, 245, 0.15);
            border: 1px solid rgba(10, 200, 245, 0.4);
            color: var(--cyan-accent);
            padding: 2px 7px;
            border-radius: 20px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            font-family: var(--font-heading);
            font-weight: 700;
            margin-left: 6px;
            vertical-align: middle;
        }

        .col-id {
            font-size: 0.82rem;
            color: var(--text-muted);
            font-family: 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.06);
            display: inline-block;
        }

        .role-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-family: var(--font-heading);
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding: 5px 14px;
            border-radius: 20px;
        }

        .role-top    { color: #e74c3c; background: rgba(231, 76, 60, 0.12);  border: 1px solid rgba(231, 76, 60, 0.3);  }
        .role-jungle { color: #2ecc71; background: rgba(46, 204, 113, 0.12); border: 1px solid rgba(46, 204, 113, 0.3); }
        .role-mid    { color: #9b59b6; background: rgba(155, 89, 182, 0.12); border: 1px solid rgba(155, 89, 182, 0.3); }
        .role-adc    { color: #f39c12; background: rgba(243, 156, 18, 0.12); border: 1px solid rgba(243, 156, 18, 0.3); }
        .role-support{ color: #3498db; background: rgba(52, 152, 219, 0.12); border: 1px solid rgba(52, 152, 219, 0.3); }

        .col-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        .btn-edit, .btn-remove {
            padding: 7px 14px;
            border-radius: 6px;
            font-family: var(--font-heading);
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid;
        }

        .btn-edit {
            background: rgba(200, 170, 110, 0.08);
            border-color: rgba(200, 170, 110, 0.4);
            color: var(--gold-main);
        }

        .btn-edit:hover {
            background: rgba(200, 170, 110, 0.2);
            box-shadow: 0 0 12px rgba(200, 170, 110, 0.25);
        }

        .btn-remove {
            background: rgba(255, 77, 77, 0.06);
            border-color: rgba(255, 77, 77, 0.35);
            color: #ff4d4d;
        }

        .btn-remove:hover {
            background: rgba(255, 77, 77, 0.18);
            box-shadow: 0 0 12px rgba(255, 77, 77, 0.2);
        }

        /* =============================== */
        /* EDIT MODAL                      */
        /* =============================== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(6px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.open {
            display: flex;
        }

        .modal-box {
            background: #0b0f1a;
            border: 1px solid var(--glass-border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 480px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            animation: modalIn 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
            position: relative;
        }

        @keyframes modalIn {
            from { transform: scale(0.88) translateY(20px); opacity: 0; }
            to   { transform: scale(1) translateY(0); opacity: 1; }
        }

        .modal-title {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            font-weight: 800;
            color: var(--gold-main);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 8px;
        }

        .modal-sub {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .modal-close {
            position: absolute;
            top: 16px;
            right: 20px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }

        .modal-close:hover { color: white; }

        .modal-field {
            margin-bottom: 20px;
        }

        .modal-field label {
            font-family: var(--font-heading);
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--gold-main);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            display: block;
            margin-bottom: 8px;
        }

        .modal-field input,
        .modal-field select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-light);
            font-family: var(--font-body);
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
            margin-bottom: 0;
        }

        .modal-field input:focus,
        .modal-field select:focus {
            border-color: var(--gold-main);
            box-shadow: 0 0 12px rgba(200, 170, 110, 0.25);
        }

        .modal-actions {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .modal-actions .btn {
            margin-top: 0;
            flex: 1;
            text-align: center;
            padding: 12px 20px;
            font-size: 0.9rem;
        }

        .btn.secondary {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.15);
            color: var(--text-muted);
        }

        .btn.secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            box-shadow: none;
            transform: none;
        }

        /* =============================== */
        /* REMOVED PLAYER SLOT             */
        /* =============================== */
        .roster-row.empty-slot {
            opacity: 0.5;
        }

        .player-slot-empty {
            font-family: var(--font-heading);
            font-size: 0.9rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            font-style: italic;
        }

        /* =============================== */
        /* NO TEAM / NOT REGISTERED        */
        /* =============================== */
        .no-team-card {
            text-align: center;
            padding: 80px 40px;
            background: var(--glass-bg);
            border: 1px dashed var(--glass-border);
            border-radius: 20px;
        }

        .no-team-icon {
            font-size: 4rem;
            margin-bottom: 20px;
        }

        .no-team-card h3 {
            font-size: 1.8rem;
            color: var(--text-muted);
            margin-bottom: 16px;
        }
    </style>
</head>
<body class="home">

    <header>
        <div class="left-logo"><img src="images/logo.png" alt="Logo"></div>
        <nav>
            <a href="index.html">Home</a>
            <a href="schedule.html">Schedule</a>
            <a href="players.html">Players</a>
            <a href="team.html" class="active">My Team</a>
            <a href="contact.html">Contact</a>
        </nav>
        <div class="right-logo"><img src="images/uni-logo.png" alt="Uni Logo"></div>
    </header>

    <section class="myteam-section">
        <div class="myteam-inner">

            <div class="page-heading">
                <h2>My Team</h2>
                <p>Manage your squad — edit players, swap roles, or disband before the tournament starts.</p>
            </div>

            <div id="myTeamContent">
                <!-- Injected by JS -->
            </div>

        </div>
    </section>

    <!-- Edit Player Modal -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()">✕</button>
            <div class="modal-title" id="modalTitle">Edit Player</div>
            <div class="modal-sub" id="modalSub">Update this player's details</div>

            <div class="modal-field">
                <label>Full Name</label>
                <input type="text" id="editName" placeholder="Player's full name">
            </div>
            <div class="modal-field">
                <label>Summoner ID #TAG</label>
                <input type="text" id="editId" placeholder="SummonerName#TAG">
            </div>
            <div class="modal-field">
                <label>Role</label>
                <select id="editRole">
                    <option value="Top">Top</option>
                    <option value="Jungle">Jungle</option>
                    <option value="Mid">Mid</option>
                    <option value="ADC">ADC</option>
                    <option value="Support">Support</option>
                </select>
            </div>

            <div class="modal-actions">
                <button class="btn secondary" onclick="closeModal()">Cancel</button>
                <button class="btn" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <footer>© 2026 University League Championship | All Rights Reserved</footer>

    <script>
        const API_BASE = "http://localhost:3000";
        const STORAGE_KEY = 'tournament_teams';
        const MY_TEAM_KEY = 'myTeamName';

        async function fetchAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`);
                const result = await response.json();
                return result;
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        async function postAPI(endpoint, data) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        async function deleteAPI(endpoint) {
            try {
                const response = await fetch(`${API_BASE}${endpoint}`, { method: 'DELETE' });
                return await response.json();
            } catch (error) {
                console.error('API Error:', error);
                return null;
            }
        }

        const ROLE_CONFIG = {
            'Top':     { icon: '🛡️', cls: 'top' },
            'Jungle':  { icon: '🌲', cls: 'jungle' },
            'Mid':     { icon: '⚡', cls: 'mid' },
            'ADC':     { icon: '🎯', cls: 'adc' },
            'Support': { icon: '💙', cls: 'support' },
        };

        let editingPlayerIndex = null;

        function escHtml(str) {
            const d = document.createElement('div');
            d.appendChild(document.createTextNode(str));
            return d.innerHTML;
        }

        function getRoleCfg(role) {
            return ROLE_CONFIG[role] || { icon: '❓', cls: 'mid' };
        }

        async function getMyTeam() {
            const myName = localStorage.getItem(MY_TEAM_KEY);
            if (!myName) return null;
            const result = await fetchAPI(`/teams/${encodeURIComponent(myName)}`);
            return result?.data || null;
        }

        async function renderMyTeam() {
            const container = document.getElementById('myTeamContent');
            const team = await getMyTeam();

            if (!team) {
                container.innerHTML = `
                    <div class="no-team-card">
                        <div class="no-team-icon">🏟️</div>
                        <h3>You Haven't Registered a Team Yet</h3>
                        <p>Head to the registration page to lock in your squad for the tournament.</p>
                        <a href="contact.html" class="btn" style="margin-top: 10px;">Register a Team</a>
                    </div>`;
                return;
            }

            const rows = team.players.map((p, i) => {
                const cfg = getRoleCfg(p.role);
                const isCap = i === 0;

                if (!p.name) {
                    // Empty slot (player was removed)
                    return `
                        <div class="roster-row player-row empty-slot">
                            <span class="col-num">${i + 1}</span>
                            <div class="player-info">
                                <div class="player-avatar" style="background: rgba(255,255,255,0.05); border: 1.5px dashed rgba(255,255,255,0.2);">—</div>
                                <span class="player-slot-empty">Player slot available</span>
                            </div>
                            <span class="col-id" style="opacity:0.4">—</span>
                            <span></span>
                            <div class="col-actions">
                                <button class="btn-edit" onclick="openEdit(${i})">+ Fill Slot</button>
                            </div>
                        </div>`;
                }

                return `
                    <div class="roster-row player-row ${isCap ? 'captain-row' : ''}">
                        <span class="col-num">${i + 1}</span>
                        <div class="player-info">
                            <div class="player-avatar icon-bg-${cfg.cls}">${cfg.icon}${isCap ? '' : ''}</div>
                            <span class="player-fullname">
                                ${escHtml(p.name)}
                                ${isCap ? '<span class="captain-tag">👑 Captain</span>' : ''}
                            </span>
                        </div>
                        <span class="col-id">${escHtml(p.id)}</span>
                        <span><span class="role-pill role-${cfg.cls}">${cfg.icon} ${p.role}</span></span>
                        <div class="col-actions">
                            <button class="btn-edit" onclick="openEdit(${i})">Edit</button>
                            ${!isCap ? `<button class="btn-remove" onclick="removePlayer(${i})">Remove</button>` : ''}
                        </div>
                    </div>`;
            }).join('');

            container.innerHTML = `
                <div class="team-identity">
                    <div class="team-identity-left">
                        <div class="team-logo-placeholder">⚔️</div>
                        <div>
                            <div class="team-identity-name">${escHtml(team.teamName)}</div>
                            <div class="team-identity-sub">Registered for ULC 2026 · 5 Players</div>
                        </div>
                    </div>
                    <div class="team-actions">
                        <a href="players.html" class="btn" style="margin-top:0; padding: 10px 20px; font-size:0.85rem;">View All Teams</a>
                        <button class="btn-disband" onclick="disbandTeam()">⚠ Disband Team</button>
                    </div>
                </div>
                <div class="roster-table-wrap">
                    <div class="roster-row header-row">
                        <span>#</span>
                        <span>Player</span>
                        <span>Summoner ID</span>
                        <span>Role</span>
                        <span></span>
                    </div>
                    ${rows}
                </div>`;
        }

        /* =============================== */
        /* EDIT MODAL LOGIC                */
        /* =============================== */
        async function openEdit(playerIndex) {
            const team = await getMyTeam();
            if (!team) return;
            const p = team.players[playerIndex];

            editingPlayerIndex = playerIndex;

            document.getElementById('modalTitle').innerText = playerIndex === 0 ? '👑 Edit Captain' : `⚔️ Edit Player ${playerIndex + 1}`;
            document.getElementById('modalSub').innerText = p.name ? `Editing: ${p.name}` : 'Fill in this player slot';
            document.getElementById('editName').value = p.name || '';
            document.getElementById('editId').value = p.id || '';
            document.getElementById('editRole').value = p.role || 'Top';

            document.getElementById('editModal').classList.add('open');
        }

        function closeModal() {
            document.getElementById('editModal').classList.remove('open');
            editingPlayerIndex = null;
        }

        async function saveEdit() {
            if (editingPlayerIndex === null) return;

            const name = document.getElementById('editName').value.trim();
            const id   = document.getElementById('editId').value.trim();
            const role = document.getElementById('editRole').value;

            if (!name || !id) {
                alert('Please fill in both the player name and summoner ID.');
                return;
            }

            const myName = localStorage.getItem(MY_TEAM_KEY);
            const teamResult = await fetchAPI(`/teams/${encodeURIComponent(myName)}`);
            if (!teamResult?.data) return;

            const team = teamResult.data;
            team.players[editingPlayerIndex] = { name, id, role };

            await fetch(`${API_BASE}/teams/${encodeURIComponent(myName)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ players: team.players })
            });

            closeModal();
            renderMyTeam();
        }

        /* =============================== */
        /* REMOVE PLAYER                   */
        /* =============================== */
        async function removePlayer(playerIndex) {
            const team = await getMyTeam();
            if (!team) return;
            const p = team.players[playerIndex];
            const confirmed = confirm(`Remove ${p.name} from the roster?\n\nThe slot will remain open until you fill it.`);
            if (!confirmed) return;

            const myName = localStorage.getItem(MY_TEAM_KEY);
            team.players[playerIndex] = { name: '', id: '', role: '' };

            await fetch(`${API_BASE}/teams/${encodeURIComponent(myName)}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ players: team.players })
            });

            renderMyTeam();
        }

        /* =============================== */
        /* DISBAND TEAM                    */
        /* =============================== */
        async function disbandTeam() {
            const team = await getMyTeam();
            if (!team) return;
            const confirmed = confirm(`⚠️ DISBAND "${team.teamName}"?\n\nThis will permanently remove your team from the tournament. This cannot be undone.`);
            if (!confirmed) return;

            await deleteAPI(`/teams/${encodeURIComponent(team.teamName)}`);
            localStorage.removeItem(MY_TEAM_KEY);

            renderMyTeam();
        }

        /* Close modal on overlay click */
        document.getElementById('editModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        /* Keyboard close */
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape') closeModal();
        });

        /* Init */
        document.addEventListener('DOMContentLoaded', renderMyTeam);
    </script>
</body>
</html>
