<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Tournament</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <div class="logo-wrap"><img src="images/logo.png" alt="Logo"><span>Zoltrakk Arena</span></div>
  <nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="players.html">Players</a><a href="tournaments.html">Tournaments</a><a class="active" href="create.html">Create</a><a href="contact.html">Contact</a></nav>
  <button class="theme-toggle" data-theme-toggle>Theme</button>
</header>
<section>
  <div class="container card" style="padding:20px">
    <h2>Create a Tournament With Friends</h2>
    <p>Pick a game and build your squad with game-specific roles so each tournament feels authentic.</p>
    <form id="createTournamentForm">
      <div class="form-grid">
        <div>
          <label>Tournament Name</label>
          <input id="tournamentName" required placeholder="Friday Night Showdown">
        </div>
        <div>
          <label>Admin Name</label>
          <input id="adminName" required placeholder="Your name">
        </div>
      </div>
      <div class="form-grid">
        <div>
          <label>Game</label>
          <select id="tournamentGame" required>
            <option value="">Select game</option>
            <option value="League of Legends">League of Legends</option>
            <option value="Valorant">Valorant</option>
            <option value="CS2">CS2</option>
            <option value="Overwatch">Overwatch</option>
          </select>
        </div>
      </div>
      <p id="gameSystemHint" class="success"></p>
      <div id="lineupFields"></div>
      <button class="btn" type="submit">Save Tournament</button>
      <p id="createTournamentMsg" class="error"></p>
    </form>
  </div>
</section>
<footer>© 2026 Zoltrakk Tournament</footer>
<script src="script.js"></script>
</body>
</html>
