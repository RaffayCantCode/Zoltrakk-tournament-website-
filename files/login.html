<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Uni LoL Tournament</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .pass-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .toggle-emoji {
            position: absolute;
            right: 10px;
            cursor: pointer;
            font-size: 1.2rem;
            user-select: none;
        }

        .error {
            color: #ff4d4d;
            font-size: 0.85em;
            display: block;
            margin-bottom: 10px;
        }

        .main-error {
            color: #ff4d4d;
            font-weight: bold;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body class="home">

    <header>
        <div class="left-logo">
            <img src="images/logo.png" alt="Tournament Logo">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="schedule.html">Schedule</a>
            <a href="players.html">Players</a>
            <a href="team.html">My Team</a>
            <a href="contact.html">Contact</a>
            <a href="signup.html">Sign Up</a>
            <a href="login.html">Login</a>
        </nav>
        <div class="right-logo">
            <img src="images/uni-logo.png" alt="University Logo">
        </div>
    </header>

    <section class="contact">
        <div class="container">
            <h2>Player Login</h2>
            <form id="loginForm" novalidate>
                <label>Email Address:</label>
                <input type="email" id="lEmail">
                <span id="eErr" class="error"></span>

                <label>Password:</label>
                <div class="pass-wrapper">
                    <input type="password" id="lPass" style="width: 100%;">
                    <span id="eyeBtn" class="toggle-emoji">🙈</span>
                </div>
                <span id="pErr" class="error"></span>

                <button type="submit" class="btn">Login</button>
            </form>
            <div style="text-align: center; margin-top: 25px;">
                <p style="color: var(--text-muted); font-size: 0.95rem;">
                    Don't have an account?
                    <a href="signup.html" style="color: var(--cyan-accent); text-decoration: none; font-weight: bold; letter-spacing: 1px; transition: all 0.3s ease; text-shadow: 0 0 5px rgba(10, 200, 245, 0.3);">
                        Create one here
                    </a>
                </p>
            </div>
            <div id="loginStatus" class="main-error"></div>
        </div>
    </section>

    <footer>
        © 2026 University League Championship | All Rights Reserved
    </footer>

    <script>
        const eyeBtn = document.getElementById('eyeBtn');
        const lPass = document.getElementById('lPass');

        // Password Show/Hide Feature
        eyeBtn.addEventListener('click', () => {
            if (lPass.type === "password") {
                lPass.type = "text";
                eyeBtn.innerText = "👁️";
            } else {
                lPass.type = "password";
                eyeBtn.innerText = "🙈";
            }
        });

        // Working Login Logic with LocalStorage Verification
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault(); // Stop page from refreshing

            let valid = true;
            const emailValue = document.getElementById('lEmail').value;
            const passValue = lPass.value;

            // Clear previous errors
            document.getElementById('eErr').innerText = "";
            document.getElementById('pErr').innerText = "";
            document.getElementById('loginStatus').innerText = "";

            // Basic empty field validation
            if (!emailValue) {
                document.getElementById('eErr').innerText = "Email is required";
                valid = false;
            }
            if (!passValue) {
                document.getElementById('pErr').innerText = "Password is required";
                valid = false;
            }

            if (valid) {
                // Fetch saved credentials from the browser's storage
                const savedEmail = localStorage.getItem('registeredEmail');
                const savedPassword = localStorage.getItem('registeredPassword');

                // Verify credentials
                if (emailValue === savedEmail && passValue === savedPassword) {
                    alert("Login Successful! Welcome back to the Rift.");

                    localStorage.setItem('isLoggedIn', 'true');

                    // Redirect to home page upon successful login
                    window.location.href = "index.html";
                } else {
                    // Show error if email/password don't match or don't exist
                    document.getElementById('loginStatus').innerText = "❌ Invalid Email or Password. Please try again or Sign Up.";
                }
            }
        });
    </script>
</body>
</html>
