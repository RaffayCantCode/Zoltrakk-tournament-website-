<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Zoltrakk Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo-wrap"><a href="index.html" class="logo-text">Zoltrakk Arena</a></div>
  <nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="players.html">Players</a><a href="tournaments.html">Browse</a><a href="create.html">Create</a><a href="team.html">Teams</a><a href="contact.html">Support</a><a href="my-tournaments.html">My Hub</a><a href="signup.html">Sign Up</a><a href="login.html">Login</a></nav>
  <button class="theme-toggle" data-theme-toggle>Theme</button>
</header>

<section>
  <div class="container card" style="padding:20px;max-width:620px">
    <h2>Login</h2>
    <p>Login to manage your tournaments and access your history dashboard.</p>
    <form id="loginForm" novalidate>
      <label>Email Address</label><input id="lEmail"><div class="error" id="eErr"></div>
      <label>Password</label>
      <div style="position:relative">
        <input id="lPass" type="password">
        <button type="button" id="eyeBtn" style="position:absolute;right:8px;top:8px;border:none;background:transparent;cursor:pointer">&#128584;</button>
      </div>
      <div class="error" id="pErr"></div>
      <button class="btn" type="submit">Login</button>
      <div class="error" id="loginStatus"></div>
    </form>
    <p style="margin-top:18px;color:var(--muted)">Don't have an account? <a class="btn alt" href="signup.html" style="display:inline-block;margin-top:8px">Create Account</a></p>
  </div>
</section>

<footer>&copy; 2026 Zoltrakk Tournament</footer>
<script src="script.js"></script>
</body>
</html>
