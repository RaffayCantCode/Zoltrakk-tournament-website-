<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments - Zoltrakk Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo-wrap"><a href="index.html" class="logo-text">Zoltrakk Arena</a></div>
  <nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="players.html">Players</a><a href="tournaments.html">Browse</a><a href="create.html">Create</a><a href="team.html">Teams</a><a href="contact.html">Support</a><a href="my-tournaments.html">My Hub</a><a href="signup.html">Sign Up</a><a href="login.html">Login</a></nav>
  <button class="theme-toggle" data-theme-toggle>Theme</button>
</header>

<section>
  <div class="container card" style="padding:20px">
    <h2>Tournaments Hub</h2>
    <p>Create, join, search, and manage active gaming tournaments. Completed events are kept in the archive.</p>
    <a class="btn" href="create.html">Create Tournament</a>
    <a class="btn alt" href="archive.html">Tournament Archive</a>
  </div>
</section>

<section>
  <div class="container">
    <h2>Live Tournament List</h2>
    <p id="activeGameFilterNote" class="hint-text"></p>
    <div class="filter-bar card" style="padding:14px;margin-bottom:14px">
      <div><label>Search</label><input id="tournamentSearch" placeholder="Search tournaments or games"></div>
      <div><label>Game</label><select id="tournamentGameFilter"><option value="">All games</option><option>League of Legends</option><option>Valorant</option><option>CS2</option><option>Overwatch</option></select></div>
      <div><label>Sort</label><select id="tournamentSort"><option value="newest">Newest</option><option value="upcoming">Upcoming</option><option value="popular">Most Popular</option><option value="active">Active</option></select></div>
    </div>
    <div data-created-tournaments></div>
  </div>
</section>

<footer>&copy; 2026 Zoltrakk Tournament</footer>
<script src="script.js"></script>
</body>
</html>
