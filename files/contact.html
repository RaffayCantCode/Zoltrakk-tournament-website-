<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Contact</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <div class="logo-wrap"><img src="images/logo.png" alt="Logo"><span>Zoltrakk Arena</span></div>
  <nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="players.html">Players</a><a class="active" href="contact.html">Contact</a></nav>
  <button class="theme-toggle" data-theme-toggle>Theme</button>
</header>
<section>
  <div class="container card" style="padding:20px">
    <h2>Contact Form</h2>
    <form id="contactForm">
      <div class="form-grid">
        <div><label>Full Name *</label><input required></div>
        <div><label>Email *</label><input type="email" required></div>
      </div>
      <label>Date of Birth *</label><input type="date" required>
      <label>Message *</label><textarea required></textarea>
      <button class="btn" type="submit">Send Message</button>
      <button class="btn alt" type="reset">Clear Form</button>
    </form>
  </div>
</section>
<footer>© 2026 Zoltrakk Tournament</footer>
<script src="script.js"></script>
</body>
</html>
