<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Players</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <div class="logo-wrap"><img src="images/logo.png" alt="Logo"><span>Zoltrakk Arena</span></div>
  <nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a class="active" href="players.html">Players</a><a href="contact.html">Contact</a></nav>
  <button class="theme-toggle" data-theme-toggle>Theme</button>
</header>
<section>
  <div class="container">
    <h2>Player Cards</h2>
    <div class="player-controls">
      <input id="searchPlayer" placeholder="Search player by name">
      <select id="filterGame"><option value="">All Games</option><option>Valorant</option><option>CS2</option><option>League of Legends</option></select>
      <select id="filterRank"><option value="">All Ranks</option><option>Diamond</option><option>Platinum</option><option>Gold</option><option>Silver</option></select>
    </div>
    <div id="playerGrid" class="player-grid"></div>
  </div>
</section>
<section>
  <div class="container card" style="padding:20px">
    <h2>Tournament Registration (Max 10)</h2>
    <form id="regForm">
      <div class="form-grid">
        <div><label>Name</label><input id="regName" required></div>
        <div><label>Game</label><select id="regGame"><option>Valorant</option><option>CS2</option><option>League of Legends</option></select></div>
      </div>
      <button class="btn" type="submit">Register</button>
      <p id="regMsg" class="error"></p>
    </form>
    <p><strong>Total Registered Players: </strong><span id="totalRegistered">0</span>/10</p>
    <ul id="participantsList" class="participants"></ul>
  </div>
</section>
<footer>© 2026 Zoltrakk Tournament</footer>
<script src="script.js"></script>
</body>
</html>
