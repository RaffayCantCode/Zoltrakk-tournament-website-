<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up - Zoltrakk Arena</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <div class="logo-wrap"><a href="index.html" class="logo-text">Zoltrakk Arena</a></div>
</header>

<section>
  <div class="container card" style="padding:20px;max-width:760px">
    <h2>Create Account</h2>
    <p>Sign up once to create tournaments, share links, and manage tournament history.</p>
    <form id="signupForm" novalidate>
      <div class="form-grid">
        <div><label>First Name</label><input id="fName"><div class="error" id="fNameErr"></div></div>
        <div><label>Last Name</label><input id="lName"><div class="error" id="lNameErr"></div></div>
        <div><label>Age</label><input type="number" id="age"><div class="error" id="ageErr"></div></div>
        <div><label>Email Address</label><input id="email"><div class="error" id="emailErr"></div></div>
      </div>
      <label>Password</label><input type="password" id="pass"><div class="strength"><div id="strengthBar" class="strength-bar"></div></div><div class="error" id="passErr"></div>
      <label>Confirm Password</label><input type="password" id="confirmPass"><div class="error" id="matchErr"></div>
      <button class="btn" type="submit">Submit</button>
      <div id="signupSuccess" class="success"></div>
    </form>
  </div>
</section>

<footer>
  <div class="footer-links">
    <a href="index.html">Home</a>
    <a href="tournaments.html">Browse</a>
    <a href="leaderboard.html">Leaderboard</a>
    <a href="create.html">Create</a>
    <a href="schedule.html">Schedule</a>
    <a href="players.html">Players</a>
    <a href="team.html">Teams</a>
    <a href="my-tournaments.html">My Hub</a>
    <a href="profile.html">Profile</a>
    <a href="contact.html">Support</a>
    <a href="signup.html">Sign Up</a>
    <a href="login.html">Login</a>
  </div>
  <div>
    <span class="footer-brand">Zoltrakk Arena</span>
    <span style="display:block;margin-top:8px">&copy; 2026 Zoltrakk Tournament — Built for players, by players.</span>
  </div>
</footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>
</body>
</html>
