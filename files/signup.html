<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Sign Up</title><link rel="stylesheet" href="style.css"></head>
<body>
<header>
  <div class="logo-wrap"><img src="images/logo.png" alt="Logo"><span>Zoltrakk Arena</span></div>
  <nav><a href="index.html">Home</a><a href="schedule.html">Schedule</a><a href="players.html">Players</a><a href="contact.html">Contact</a><a class="active" href="signup.html">Sign Up</a><a href="login.html">Login</a></nav>
  <button class="theme-toggle" data-theme-toggle>Theme</button>
</header>
<section>
  <div class="container card" style="padding:20px;max-width:700px">
    <h2>Sign Up</h2>
    <form id="signupForm" novalidate>
      <div class="form-grid">
        <div><label>First Name</label><input id="fName"><div class="error" id="fNameErr"></div></div>
        <div><label>Last Name</label><input id="lName"><div class="error" id="lNameErr"></div></div>
        <div><label>Age</label><input type="number" id="age"><div class="error" id="ageErr"></div></div>
        <div><label>Email Address</label><input id="email"><div class="error" id="emailErr"></div></div>
      </div>
      <label>Password</label><input type="password" id="pass"><div class="strength"><div id="strengthBar" class="strength-bar"></div></div><div class="error" id="passErr"></div>
      <label>Confirm Password</label><input type="password" id="confirmPass"><div class="error" id="matchErr"></div>
      <button class="btn" type="submit">Submit</button>
      <div id="signupSuccess" class="success"></div>
    </form>
  </div>
</section>
<footer>© 2026 Zoltrakk Tournament</footer>
<script src="script.js"></script>
</body>
</html>
