[[redirects]]
  from = "/my-tournaments"
  to = "/my-tournaments.html"
  status = 200

[[redirects]]
  from = "/players"
  to = "/players.html"
  status = 200

[[redirects]]
  from = "/profile"
  to = "/profile.html"
  status = 200

[[redirects]]
